          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestMessageAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

# --------------------------------------------------------------------------- Webhooks sortants
webhooks:
  agent24Event:
    post:
      tags: [Webhooks]
      operationId: receiveAgent24Event
      summary: Livraison d'un événement
      description: |
        Agent24 envoie un `POST` JSON à chaque endpoint déclaré qui est abonné au type d'événement.

        **Signature.** L'en-tête `Agent24-Signature` a la forme `t=<horodatage>,v1=<signature>`, où
        `<signature>` est le HMAC-SHA256, en hexadécimal, de la chaîne `<horodatage>.<corps brut>` avec le
        secret de l'endpoint (`whsec_…`). Recalculez-la, comparez en temps constant, et rejetez les
        livraisons dont l'horodatage a plus de 5 minutes d'écart avec votre horloge.

        **Réponse.** Répondez `2xx` rapidement (quelques secondes). Tout autre résultat, ou un délai
        dépassé, déclenche de nouvelles tentatives espacées ; après des échecs répétés, l'endpoint est
        désactivé et une alerte est émise. Une même livraison peut arriver plusieurs fois : dédoublonnez
        avec `id`.

        **Contenu.** Événements minces : identifiants uniquement, jamais le texte des messages.
      security: []
      parameters:
        - name: Agent24-Signature
          in: header
          required: true
          schema: { type: string }
          example: 't=1793962345,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '200': { description: Livraison reçue. }

# --------------------------------------------------------------------------- Composants
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: a24_live_… | a24_test_…
      description: |
        Clé API, pour les appels de serveur à serveur. L'espace (test ou live) est déterminé par la clé.
        Les droits dépendent des portées de la clé (`x-required-scope`).
    UserToken:
      type: http
      scheme: bearer
      description: |
        Jeton d'accès d'un utilisateur humain, obtenu avec `POST /v1/auth/login`. Les droits dépendent du rôle
        (`x-required-role` : `readonly` < `employee` < `manager` < `owner`). L'en-tête `Agent24-Mode` choisit
        l'espace.

  parameters:
    Limit:
      name: limit
      in: query
      description: Nombre maximal d'éléments renvoyés.
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    Cursor:
      name: cursor
      in: query
      description: Curseur opaque renvoyé dans `next_cursor` par la page précédente.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Chaîne unique (UUID conseillé) choisie par le client. Rejouer la même clé avec le même corps renvoie
        la réponse de la première requête, sans nouvel effet ; avec un corps différent : `409`.
        Les clés sont conservées 24 heures.
      schema: { type: string, maxLength: 255 }
    Mode:
      name: Agent24-Mode
      in: header
      description: Espace visé avec un jeton utilisateur. Ignoré avec une clé API (la clé fixe l'espace).
      schema:
        type: string
        enum: [live, test]
        default: live
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, example: conv_2kq9x7m }
    EscalationId:
      name: escalation_id
      in: path
      required: true
      schema: { type: string, example: esc_8s2v1d }
    ContactId:
      name: contact_id
      in: path
      required: true
      schema: { type: string, example: ctc_5h3p0w }
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { type: string, example: chn_4b7n2c }
    ApiKeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, example: key_9d1f6a }
    MemberId:
      name: member_id
      in: path
      required: true
      schema: { type: string, example: usr_3m8e5r }
    WebhookEndpointId:
      name: endpoint_id
      in: path
      required: true
      schema: { type: string, example: whe_7c4t2k }
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema: { type: string, example: whd_1x9z3q }

  responses:
    BadRequest:
      description: Requête mal formée.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Identifiant absent, invalide, expiré ou révoqué (`authentication_error`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              type: authentication_error
              code: invalid_api_key
              message: La clé API fournie est invalide ou a été révoquée.
              request_id: req_6f2a9c1e
    Forbidden:
      description: |
        Identifiant valide mais droits insuffisants : portée manquante, rôle insuffisant, ou action réservée
        au jeton utilisateur (`permission_error`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              type: permission_error
              code: missing_scope
              message: Cette clé n'a pas la portée requise.
              request_id: req_6f2a9c1e
              param: conversations:write
    NotFound:
      description: Ressource introuvable dans l'espace courant (`not_found_error`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        L'état actuel ne permet pas l'action (`conflict_error`), par exemple : conversation déjà prise en
        charge, `Idempotency-Key` réutilisée avec un autre corps, action réservée à l'espace de test.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: La version fournie dans `If-Match` n'est plus la version courante.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Paramètres valides en forme mais refusés (`invalid_request_error`). `param` désigne le champ fautif.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Limite de débit dépassée (`rate_limit_error`).
      headers:
        Retry-After:
          description: Secondes à attendre avant de réessayer.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------------------------------------------------------------- Erreurs et listes
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - conflict_error
                - rate_limit_error
                - api_error
            code:
              type: string
              description: |
                Code stable, lisible par une machine. Exemples : `invalid_api_key`, `missing_scope`,
                `insufficient_role`, `not_found`, `conversation_not_human`, `already_taken`,
                `idempotency_key_reuse`, `live_mode_not_allowed`, `rate_limited`.
            message:
              type: string
              description: Explication lisible par un humain (français). Ne dépendez pas de son texte.
            request_id:
              type: string
              description: Identique à l'en-tête `X-Request-Id`.
            param:
              type: string
              description: Champ ou paramètre concerné, le cas échéant.
          example:
            type: invalid_request_error
            code: text_too_long
            message: Le texte dépasse 4000 caractères.
            request_id: req_6f2a9c1e
            param: text

    ListMeta:
      type: object
      required: [object, has_more, next_cursor]
      properties:
        object: { type: string, const: list }
        has_more: { type: boolean }
        next_cursor:
          type: [string, 'null']
          description: À fournir dans `cursor` pour obtenir la page suivante ; `null` s'il n'y en a pas.

    # ---------------------------------------------------------------- Authentification
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    TokenPair:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          description: Durée de validité du jeton d'accès, en secondes.
        refresh_token:
          type: string
          description: À usage unique ; remplacé à chaque renouvellement.
    Principal:
      type: object
      required: [account, livemode, auth]
      properties:
        account:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        livemode: { type: boolean }
        auth:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [api_key, user] }
            key_id: { type: string, description: Présent si `type = api_key`. }
            scopes:
              type: array
              items: { type: string }
              description: Présent si `type = api_key`.
            user:
              $ref: '#/components/schemas/Member'
              description: Présent si `type = user`.

    # ---------------------------------------------------------------- Compte et équipe
    Account:
      type: object
      required: [id, name, timezone, status, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        timezone:
          type: string
          description: Fuseau IANA ; sert aux statistiques par jour et par heure.
          example: Africa/Porto-Novo
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
    AccountUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string }
    Role:
      type: string
      enum: [owner, manager, employee, readonly]
    MemberSummary:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }
    Member:
      type: object
      required: [id, email, name, role, status, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [invited, active, disabled] }
        created_at: { type: string, format: date-time }
    MemberInvite:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
    MemberUpdate:
      type: object
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, disabled] }
    MemberList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Member' }

    # ---------------------------------------------------------------- Clés API
    Scope:
      type: string
      enum:
        - conversations:read
        - conversations:write
        - escalations:read
        - agent:read
        - agent:write
        - contacts:read
        - contacts:write
        - config:read
        - config:write
        - channels:read
        - channels:write
        - webhooks:read
        - webhooks:write
        - events:read
        - usage:read
        - stats:read
        - test:write
      description: |
        Portées d'une clé API. Il n'existe volontairement aucune portée pour gérer les clés API, l'équipe ou
        le compte : ces actions exigent un jeton utilisateur. `test:write` n'a d'effet qu'avec une clé de test.
    ApiKey:
      type: object
      required: [id, name, mode, scopes, prefix, last4, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { type: string, enum: [live, test] }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        prefix:
          type: string
          example: a24_live_
        last4:
          type: string
          description: Quatre derniers caractères, pour reconnaître la clé dans une liste.
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nom libre pour reconnaître l'usage de la clé.
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Scope' }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Expiration optionnelle.
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Clé complète. **Affichée une seule fois**, impossible à récupérer ensuite.
              example: a24_live_k3JmQ9v2Xr7LpT0wNs5YcB8dFhZ1aEuG
    ApiKeyList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ApiKey' }

    # ---------------------------------------------------------------- Canaux
    ChannelType:
      type: string
      enum: [messenger, whatsapp, instagram, telegram, email, simulated]
      description: '`simulated` n''existe qu''en espace de test ; les autres types ne se connectent qu''en Live.'
    Channel:
      type: object
      required: [id, type, external_id, status, livemode, created_at]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ChannelType' }
        external_id:
          type: string
          description: Identifiant du compte sur la plateforme (par exemple l'identifiant de la page Facebook).
        name: { type: [string, 'null'] }
        status: { type: string, enum: [active, disabled] }
        livemode: { type: boolean }
        created_at: { type: string, format: date-time }
    ChannelCreate:
      type: object
      required: [type, external_id]
      properties:
        type: { $ref: '#/components/schemas/ChannelType' }
        external_id: { type: string }
        name: { type: string, maxLength: 120 }
        access_token:
          type: string
          writeOnly: true
          description: Jeton d'accès de la plateforme. Chiffré au repos, jamais renvoyé.
    ChannelUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 120 }
        status: { type: string, enum: [active, disabled] }
        access_token: { type: string, writeOnly: true }
    ChannelList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Channel' }
    ChannelRef:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ChannelType' }

    # ---------------------------------------------------------------- Contacts
    ContactSummary:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name:
          type: string
          description: Nom du contact, ou « Client ••1234 » (quatre derniers caractères de l'identifiant du canal) s'il est inconnu.
    Contact:
      type: object
      required: [id, channel, channel_user_id, profile, livemode, created_at]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        language:
          type: [string, 'null']
          description: Code de langue (par exemple `fr`).
        channel: { $ref: '#/components/schemas/ChannelRef' }
        channel_user_id:
          type: string
          description: Identifiant du contact sur le canal.
        profile:
          type: object
          additionalProperties: true
          description: Faits durables et notes sur le contact.
        livemode: { type: boolean }
        created_at: { type: string, format: date-time }
    ContactUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 120 }
        language: { type: string, maxLength: 10 }
        profile:
          type: object
          additionalProperties: true
          description: Fusionné avec le profil existant (les clés à `null` sont supprimées).
    ContactList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Contact' }

    # ---------------------------------------------------------------- Conversations et messages
    ConversationStatus:
      type: string
      enum: [agent, human, closed]
      description: |
        `agent` : l'agent répond. `human` : un humain a pris la main, l'agent n'envoie rien.
        `closed` : conversation close.
    Conversation:
      type: object
      required: [id, status, channel, contact, unread, livemode, created_at]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        channel: { $ref: '#/components/schemas/ChannelRef' }
        contact: { $ref: '#/components/schemas/ContactSummary' }
        last_message_at: { type: [string, 'null'], format: date-time }
        unread:
          type: boolean
          description: Des messages sont arrivés depuis la dernière lecture par l'équipe.
        escalation:
          description: Escalade active, ou `null`.
          oneOf:
            - $ref: '#/components/schemas/Escalation'
            - type: 'null'
        livemode: { type: boolean }
        created_at: { type: string, format: date-time }
    ConversationList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Conversation' }
    Message:
      type: object
      required: [id, conversation_id, direction, author, type, delivery_status, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        direction:
          type: string
          enum: [in, out]
          description: '`in` : reçu du client. `out` : envoyé au client.'
        author:
          type: string
          enum: [customer, agent, user, page_inbox]
          description: |
            `customer` : le client. `agent` : l'agent IA. `user` : un membre de l'équipe via l'API.
            `page_inbox` : réponse humaine écrite directement dans la messagerie de la page.
        type:
          type: string
          description: Type de contenu (`text`, `image`, `audio`…). Seul `text` est traité par l'agent pour l'instant.
          example: text
        text: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        delivery_status:
          type: string
          enum: [pending, sent, failed, captured]
          description: |
            Pour les messages sortants. `captured` : message enregistré sans envoi réel (espace de test).
            Toujours `sent` pour les messages entrants.
        received_at: { type: [string, 'null'], format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    MessageCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
    MessageList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Message' }

    # ---------------------------------------------------------------- Escalades
    Escalation:
      type: object
      required: [id, conversation_id, status, category, source, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        status: { type: string, enum: [open, taken, resolved] }
        category:
          type: string
          enum: [plainte, litige, paiement, information_manquante, sensible, technique, autre]
        source:
          type: string
          enum: [agent, system]
          description: '`agent` : demandée par l''agent. `system` : déclenchée par le système (échec technique, par exemple).'
        reason: { type: [string, 'null'] }
        summary:
          type: [string, 'null']
          description: Résumé du contexte pour la personne qui prend le relais.
        resolution:
          type: [string, 'null']
          enum: [handed_back, closed, null]
        taken_by:
          description: Membre qui a pris la conversation en charge.
          oneOf:
            - $ref: '#/components/schemas/MemberSummary'
            - type: 'null'
        taken_at: { type: [string, 'null'], format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    EscalationList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data, counts]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Escalation' }
            counts:
              type: object
              description: Nombre d'escalades par statut, indépendamment du filtre.
              required: [open, taken, resolved]
              properties:
                open: { type: integer }
                taken: { type: integer }
                resolved: { type: integer }

    # ---------------------------------------------------------------- Agent
    AgentStatus:
      type: object
      required: [paused]
      properties:
        paused: { type: boolean }
        paused_at: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------------------- Configuration
    ConfigDocument:
      type: object
      description: |
        Comportement de l'agent pour ce compte. Il n'y a pas de notion de secteur : tout se règle ici.
        Les champs inconnus sont refusés (`422`).
      additionalProperties: false
      properties:
        timezone:
          type: string
          description: Fuseau IANA. Par défaut, celui du compte.
        language:
          type: array
          items: { type: string }
          description: Langues acceptées, en codes courts.
          example: [fr]
        tone:
          type: object
          additionalProperties: false
          properties:
            address:
              type: string
              description: Façon de s'adresser au client.
              example: vouvoiement
            style:
              type: string
              example: chaleureux et formel
        instructions:
          type: string
          maxLength: 20000
          description: |
            Texte libre : ce que fait l'entreprise, ses règles, ce que l'agent ne doit pas faire.
            Les règles de la plateforme restent prioritaires.
        business_info:
          type: object
          additionalProperties: true
          description: Informations officielles lues par l'agent (horaires, tarifs, politiques…).
        tools_enabled:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Outils activés pour ce compte. Un outil non activé n'est ni exposé ni exécutable.
          example: [get_business_info, escalate_to_human]
        escalation:
          type: object
          additionalProperties: false
          properties:
            notify_emails:
              type: array
              items: { type: string, format: email }
              description: Personnes prévenues par e-mail lors d'une escalade.
            topics:
              type: array
              items: { type: string }
              description: Sujets à transmettre systématiquement à un humain.
        agent:
          type: object
          additionalProperties: false
          properties:
            model:
              type: string
              description: Modèle de langage utilisé pour ce compte. Valeur par défaut de la plateforme si absent.
    Config:
      type: object
      required: [version, updated_at, document]
      properties:
        version:
          type: integer
          description: Numéro de version, croissant. Identique à l'`ETag`.
        updated_at: { type: string, format: date-time }
        updated_by:
          type: [string, 'null']
          description: Identifiant du membre ou de la clé à l'origine de la version.
        document: { $ref: '#/components/schemas/ConfigDocument' }
    ConfigVersionList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Config' }

    # ---------------------------------------------------------------- Webhooks et événements
    EventType:
      type: string
      enum:
        - message.received
        - message.sent
        - message.failed
        - conversation.updated
        - escalation.created
        - escalation.updated
        - agent.paused
        - agent.resumed
      description: |
        `message.received` : message client enregistré. `message.sent` : message sortant envoyé.
        `message.failed` : envoi sortant échoué. `conversation.updated` : état de la conversation modifié.
        `escalation.created` / `escalation.updated` : cycle de vie d'une escalade.
        `agent.paused` / `agent.resumed` : interrupteur d'urgence.
    Event:
      type: object
      required: [id, type, created, livemode, data]
      properties:
        id:
          type: string
          description: Identifiant unique ; sert à dédoublonner et à reprendre le flux (`after`, `Last-Event-ID`).
        type: { $ref: '#/components/schemas/EventType' }
        created: { type: string, format: date-time }
        livemode: { type: boolean }
        data:
          type: object
          description: Identifiants seulement ; récupérez ensuite la ressource par l'API.
          properties:
            conversation_id: { type: [string, 'null'] }
            escalation_id: { type: [string, 'null'] }
      example:
        id: evt_00000000a1b2
        type: escalation.created
        created: '2026-11-06T09:12:45Z'
        livemode: true
        data:
          conversation_id: conv_2kq9x7m
          escalation_id: esc_8s2v1d
    EventList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: '#/components/schemas/Event' }
    EventTicket:
      type: object
      required: [ticket, expires_at, stream_url]
      properties:
        ticket: { type: string }
        expires_at: { type: string, format: date-time }
        stream_url:
          type: string
          format: uri
          description: URL complète du flux, ticket inclus.
    WebhookEndpoint:
      type: object
      required: [id, url, events, status, livemode, created_at]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        description: { type: [string, 'null'] }
        events:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/EventType'
              - type: string
                const: '*'
          description: Types d'événements reçus ; `*` pour tous.
        status:
          type: string
          enum: [enabled, disabled]
          description: Passe à `disabled` automatiquement après des échecs répétés.
        livemode: { type: boolean }
        created_at: { type: string, format: date-time }
    WebhookEndpointCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
        description: { type: string, maxLength: 200 }
        events:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/EventType'
              - type: string
                const: '*'
    WebhookEndpointUpdate:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
        description: { type: string, maxLength: 200 }
        events:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/EventType'
              - type: string
                const: '*'
        status: { type: string, enum: [enabled, disabled] }
    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Secret de signature. **Affiché une seule fois.**
              example: whsec_Qm4Xr9Tz2LkP7vNc1YdW8sBjHa0EuFgV
    WebhookEndpointList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/WebhookEndpoint' }
    WebhookDelivery:
      type: object
      required: [id, endpoint_id, event_id, event_type, status, attempts, created_at]
      properties:
        id: { type: string }
        endpoint_id: { type: string }
        event_id: { type: string }
        event_type: { $ref: '#/components/schemas/EventType' }
        status: { type: string, enum: [pending, succeeded, failed] }
        attempts: { type: integer, minimum: 0 }
        response_status:
          type: [integer, 'null']
          description: Code HTTP de la dernière tentative.
        next_attempt_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    WebhookDeliveryList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/WebhookDelivery' }

    # ---------------------------------------------------------------- Usage et statistiques
    UsagePoint:
      type: object
      required: [period_start, messages_in, agent_replies, input_tokens, output_tokens]
      properties:
        period_start:
          type: string
          format: date
          description: Premier jour de la période.
        messages_in: { type: integer }
        agent_replies: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
    Usage:
      type: object
      required: [from, to, granularity, data, totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        granularity: { type: string, enum: [day, month] }
        data:
          type: array
          items: { $ref: '#/components/schemas/UsagePoint' }
        totals:
          type: object
          required: [messages_in, agent_replies, input_tokens, output_tokens]
          properties:
            messages_in: { type: integer }
            agent_replies: { type: integer }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
    DayStats:
      type: object
      required: [messages_in, agent_replies, escalations, input_tokens, output_tokens]
      properties:
        messages_in: { type: integer }
        agent_replies: { type: integer }
        escalations: { type: integer }
        avg_response_seconds:
          type: [number, 'null']
          description: Délai moyen de réponse de l'agent.
        input_tokens: { type: integer }
        output_tokens: { type: integer }
    StatsOverview:
      type: object
      required: [day, timezone, today, yesterday, escalations_by_status, conversations_by_status]
      properties:
        day: { type: string, format: date }
        timezone: { type: string }
        today: { $ref: '#/components/schemas/DayStats' }
        yesterday: { $ref: '#/components/schemas/DayStats' }
        escalations_by_status:
          type: object
          additionalProperties: { type: integer }
        conversations_by_status:
          type: object
          additionalProperties: { type: integer }
    HourCount:
      type: object
      required: [hour, messages]
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        messages: { type: integer }
    StatsActivity:
      type: object
      required: [day, timezone, today, yesterday]
      properties:
        day: { type: string, format: date }
        timezone: { type: string }
        today:
          type: array
          items: { $ref: '#/components/schemas/HourCount' }
        yesterday:
          type: array
          items: { $ref: '#/components/schemas/HourCount' }

    # ---------------------------------------------------------------- Test
    TestMessageCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        contact_ref:
          type: string
          maxLength: 100
          default: test-contact
          description: |
            Nom du contact simulé. Un même nom réutilise le même contact et la même conversation ;
            des noms différents simulent des clients différents.
    TestMessageAccepted:
      type: object
      required: [message, conversation_id]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        conversation_id: { type: string }
