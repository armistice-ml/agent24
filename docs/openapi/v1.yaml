  # ------------------------------------------------------------------ Configuration
  /v1/config:
    get:
      tags: [Configuration]
      operationId: getConfig
      summary: Lire la configuration courante de l'agent
      description: L'en-tête `ETag` contient la version ; il sert de précondition pour `PUT`.
      x-required-scope: config:read
      x-required-role: readonly
      responses:
        '200':
          description: Configuration courante.
          headers:
            ETag:
              description: Version de la configuration.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Configuration]
      operationId: putConfig
      summary: Remplacer la configuration de l'agent
      description: |
        Remplace le document complet et crée une nouvelle version. Fournissez `If-Match` avec la version lue
        pour éviter d'écraser la modification d'un autre utilisateur ; sinon `412`.
      x-required-scope: config:write
      x-required-role: manager
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Version de la configuration lue (valeur de l'en-tête `ETag`).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigDocument' }
      responses:
        '200':
          description: Nouvelle version de la configuration.
          headers:
            ETag:
              description: Nouvelle version.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v1/config/versions:
    get:
      tags: [Configuration]
      operationId: listConfigVersions
