  # ------------------------------------------------------------------ Temps réel
  /v1/events:
    get:
      tags: [Temps réel]
      operationId: listEvents
      summary: Rattraper les événements récents
      description: |
        Renvoie les événements postérieurs à `after`, du plus ancien au plus récent. À utiliser après une
        coupure du flux ou pour un client qui préfère interroger. Les événements sont conservés 7 jours.
      x-required-scope: events:read
      x-required-role: readonly
      parameters:
        - name: after
          in: query
          description: Identifiant du dernier événement reçu. Sans valeur, renvoie les plus récents.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Événements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/events/ticket:
    post:
      tags: [Temps réel]
      operationId: createEventTicket
      summary: Obtenir un ticket pour le flux temps réel
      description: |
        `EventSource` dans un navigateur ne permet pas d'envoyer l'en-tête `Authorization`. Ce ticket, à
        **usage unique** et valable une minute, s'utilise dans l'URL du flux. Il hérite de l'espace
        (test ou live) de la requête.
      x-required-scope: events:read
      x-required-role: readonly
      parameters:
        - $ref: '#/components/parameters/Mode'
      responses:
        '201':
          description: Ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/events/stream:
    get:
      tags: [Temps réel]
      operationId: streamEvents
      summary: Flux d'événements (Server-Sent Events)
      description: |
        Flux `text/event-stream`. Chaque événement SSE porte `id` (identifiant de l'événement), `event`
        (son type) et `data` (objet `Event` en JSON). Après une reconnexion, le navigateur renvoie
        `Last-Event-ID` ; à défaut, rattrapez avec `GET /v1/events?after=`.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: Ticket obtenu avec `POST /v1/events/ticket`.
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Flux ouvert.
          content:
