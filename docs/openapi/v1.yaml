openapi: 3.1.0

info:
  title: API Agent24
  version: 1.0.0-draft
  summary: Moteur d'agents IA pour la relation client, exposé par une API publique versionnée.
  description: |
    L'API Agent24 permet de piloter un agent IA qui répond aux clients d'une entreprise sur ses canaux de
    messagerie : lire les conversations, reprendre la main, configurer l'agent, brancher des canaux, recevoir
    des événements et suivre l'usage.

    > **Statut : brouillon `1.0.0-draft`.** Ce contrat précède l'implémentation. Il peut encore évoluer
    > jusqu'à la publication de `v1`.

    ## Authentification

    Deux types d'identifiants, transmis dans `Authorization: Bearer <identifiant>` :

    | | Clé API | Jeton utilisateur |
    |---|---|---|
    | Pour | un serveur (intégration, tableau pilote avec backend) | un humain connecté à une interface |
    | Forme | `a24_live_…` ou `a24_test_…` | jeton d'accès de courte durée |
    | Droits | **portées** choisies à la création (`x-required-scope`) | **rôle** de l'utilisateur (`x-required-role`) |

    Les endpoints de gestion (clés API, équipe, compte) n'acceptent **que** le jeton utilisateur : une clé
    qui fuit ne peut pas créer d'autres clés.

    **Ne placez jamais une clé API dans une application qui s'exécute dans un navigateur.** Une interface
    purement navigateur utilise des jetons utilisateur ; un tableau pilote qui a son propre serveur utilise
    une clé côté serveur.

    ## Test et Live

    Chaque compte possède deux espaces isolés. Une clé `a24_test_…` agit dans l'espace de **test** (aucun
    envoi réel vers les canaux, messages simulés avec `POST /v1/test/messages`), une clé `a24_live_…` dans
    l'espace **Live**. Avec un jeton utilisateur, l'en-tête `Agent24-Mode` choisit l'espace (Live par défaut).
    Chaque objet porte un champ `livemode`.

    ## Conventions

    - **Versionnement** : dans l'URL (`/v1`). Les ajouts compatibles (nouveaux champs, nouveaux endpoints)
      ne changent pas la version ; les clients doivent ignorer les champs inconnus.
    - **Format** : JSON, champs en `snake_case`, dates ISO 8601 en UTC.
    - **Identifiants** : chaînes opaques préfixées (`conv_…`, `msg_…`, `key_…`). Ne les analysez pas.
    - **Pagination** : par curseur (`limit`, `cursor`) ; la réponse indique `has_more` et `next_cursor`.
    - **Idempotence** : les `POST` qui créent ou déclenchent une action acceptent l'en-tête
      `Idempotency-Key` ; rejouer la même clé renvoie le résultat de la première requête.
    - **Traçabilité** : chaque réponse porte un en-tête `X-Request-Id`, à fournir au support.
    - **Limites de débit** : par clé ; en cas de dépassement, réponse `429` avec `Retry-After`. Les en-têtes
      `X-RateLimit-Limit`, `X-RateLimit-Remaining` et `X-RateLimit-Reset` indiquent l'état du quota.
    - **Erreurs** : objet uniforme `{"error": {type, code, message, request_id}}` (voir `Error`).

    ## Événements

    Les événements sont **minces** : ils portent des identifiants, jamais le contenu des messages. Récupérez
    ensuite la ressource par l'API. Ils sont livrés par webhooks sortants signés, ou en temps réel par
    SSE (`/v1/events/stream`).

  contact:
    name: Équipe Agent24

servers:
  - url: https://{host}
    description: Serveur de l'API
    variables:
      host:
        default: api.example.com
        description: Domaine de l'API (à définir au déploiement).

tags:
  - name: Authentification
    description: Connexion des utilisateurs humains et identité courante.
  - name: Compte
    description: Compte de l'entreprise et équipe.
  - name: Clés API
    description: Création, rotation et révocation des clés. Jeton utilisateur uniquement.
  - name: Conversations
    description: Conversations, messages et reprise en main par un humain.
  - name: Escalades
    description: Demandes de prise en charge humaine émises par l'agent ou le système.
  - name: Agent
    description: État de l'agent et interrupteur d'urgence.
  - name: Contacts
    description: Clients finaux.
  - name: Configuration
    description: Configuration versionnée de l'agent.
  - name: Canaux
    description: Canaux de messagerie connectés.
  - name: Webhooks
    description: Notifications sortantes vers vos systèmes.
  - name: Temps réel
    description: Événements en continu et rattrapage.
  - name: Usage et statistiques
    description: Mesures d'usage et indicateurs d'activité.
  - name: Test
    description: Outils réservés à l'espace de test.

security:
  - ApiKey: []
  - UserToken: []

paths:
  # ------------------------------------------------------------------ Authentification
  /v1/auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Ouvrir une session utilisateur
      description: Échange un e-mail et un mot de passe contre un jeton d'accès et un jeton de rafraîchissement.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session ouverte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/refresh:
    post:
      tags: [Authentification]
      operationId: refreshToken
      summary: Renouveler le jeton d'accès
      description: Le jeton de rafraîchissement est à usage unique ; la réponse en contient un nouveau (rotation).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Nouveaux jetons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Fermer la session
      description: Révoque le jeton de rafraîchissement fourni.
      security:
        - UserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Session fermée. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me:
    get:
      tags: [Authentification]
      operationId: getMe
      summary: Identité courante
      description: Indique le compte, l'espace (test ou live) et l'identifiant utilisé (clé ou utilisateur).
      responses:
        '200':
          description: Identité courante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Compte et équipe
  /v1/account:
    get:
      tags: [Compte]
      operationId: getAccount
      summary: Lire le compte
      security:
        - UserToken: []
      x-required-role: readonly
      responses:
        '200':
          description: Compte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Compte]
      operationId: updateAccount
      summary: Modifier le compte
      security:
        - UserToken: []
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Compte mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v1/members:
    get:
      tags: [Compte]
      operationId: listMembers
      summary: Lister l'équipe
      security:
        - UserToken: []
      x-required-role: manager
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Membres de l'équipe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Compte]
      operationId: inviteMember
      summary: Inviter un membre
      description: Envoie une invitation par e-mail avec le rôle indiqué.
      security:
        - UserToken: []
      x-required-role: owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInvite' }
      responses:
        '201':
          description: Invitation créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v1/members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [Compte]
      operationId: updateMember
      summary: Modifier le rôle ou le statut d'un membre
      security:
        - UserToken: []
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Membre mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Compte]
      operationId: removeMember
      summary: Retirer un membre
      description: Révoque ses sessions. Le dernier propriétaire ne peut pas être retiré.
      security:
        - UserToken: []
      x-required-role: owner
      responses:
        '204': { description: Membre retiré. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ Clés API
  /v1/api-keys:
    get:
      tags: [Clés API]
      operationId: listApiKeys
      summary: Lister les clés API
      description: Ne renvoie jamais le secret, seulement le préfixe et les quatre derniers caractères.
      security:
        - UserToken: []
      x-required-role: manager
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Clés de l'espace courant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Clés API]
      operationId: createApiKey
      summary: Créer une clé API
      description: |
        Le secret complet n'est affiché **qu'une seule fois**, dans cette réponse. Il est stocké sous forme
        d'empreinte et ne peut pas être récupéré ensuite. L'espace (test ou live) est celui de la requête.
      security:
        - UserToken: []
      x-required-role: manager
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Mode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: Clé créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyWithSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v1/api-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    get:
      tags: [Clés API]
      operationId: getApiKey
      summary: Lire une clé API
      security:
        - UserToken: []
      x-required-role: manager
      responses:
        '200':
          description: Clé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Clés API]
      operationId: revokeApiKey
      summary: Révoquer une clé API
      description: La révocation est immédiate et définitive.
      security:
        - UserToken: []
      x-required-role: manager
      responses:
        '204': { description: Clé révoquée. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/api-keys/{key_id}/roll:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    post:
      tags: [Clés API]
      operationId: rollApiKey
      summary: Faire tourner une clé API
      description: |
        Crée une nouvelle clé aux mêmes portées. L'ancienne reste valide pendant `grace_period_hours`
        (24 h par défaut) pour laisser le temps de migrer, puis expire.
      security:
        - UserToken: []
      x-required-role: manager
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_period_hours:
                  type: integer
                  minimum: 0
                  maximum: 168
                  default: 24
      responses:
        '201':
          description: Nouvelle clé (secret affiché une seule fois).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyWithSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ Conversations
  /v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: Lister les conversations
      description: Triées de la plus récente à la plus ancienne (dernier message).
      x-required-scope: conversations:read
      x-required-role: readonly
      parameters:
        - name: status
          in: query
          description: |
            `open` (par défaut) : toutes sauf les conversations closes ; `all` : toutes ; sinon un état précis.
          schema:
            type: string
            enum: [open, all, agent, human, closed]
            default: open
        - name: channel
          in: query
          description: Type de canal.
          schema: { $ref: '#/components/schemas/ChannelType' }
        - name: q
          in: query
          description: Recherche dans le nom du contact et dans le texte des messages.
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Conversations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/conversations/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Lire une conversation
      x-required-scope: conversations:read
      x-required-role: readonly
      responses:
        '200':
          description: Conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/conversations/{conversation_id}/read:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: markConversationRead
      summary: Marquer la conversation comme lue par l'équipe
      x-required-scope: conversations:write
      x-required-role: readonly
      responses:
        '204': { description: Conversation marquée comme lue. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: listMessages
      summary: Lister les messages d'une conversation
      description: Du plus récent au plus ancien.
      x-required-scope: conversations:read
      x-required-role: readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: Envoyer un message humain
      description: |
        Envoie un message au client sur le canal de la conversation, au nom de l'équipe. La conversation doit
        être prise en charge (`status = human`). En espace de test, l'envoi est simulé : le message est
        enregistré avec `delivery_status = captured`.
      x-required-scope: conversations:write
      x-required-role: employee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: "Message accepté (l'envoi réel peut échouer : voir `delivery_status`)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/conversations/{conversation_id}/take:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: takeConversation
      summary: Prendre la main sur la conversation
      description: "Passe `status` de `agent` à `human` : l'agent n'envoie plus rien. Prend en charge l'escalade active."
      x-required-scope: conversations:write
      x-required-role: employee
      responses:
        '200':
          description: Conversation mise à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/conversations/{conversation_id}/handback:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: handBackConversation
      summary: Rendre la conversation à l'agent
      description: Passe `status` de `human` à `agent` et résout l'escalade (`resolution = handed_back`).
      x-required-scope: conversations:write
      x-required-role: employee
      responses:
        '200':
          description: Conversation mise à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/conversations/{conversation_id}/close:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: closeConversation
      summary: Clore la conversation
      description: Passe `status` à `closed` et résout l'escalade active (`resolution = closed`).
      x-required-scope: conversations:write
      x-required-role: employee
      responses:
        '200':
          description: Conversation mise à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ Escalades
  /v1/escalations:
    get:
      tags: [Escalades]
      operationId: listEscalations
      summary: Lister les escalades
      description: |
        Lecture seule. Une escalade se prend en charge, se rend à l'agent ou se clôt par les actions de la
        conversation (`take`, `handback`, `close`). Il y a au plus une escalade active par conversation.
      x-required-scope: escalations:read
      x-required-role: readonly
      parameters:
        - name: status
          in: query
          description: '`handled` regroupe `taken` et `resolved`.'
          schema:
            type: string
            enum: [open, taken, resolved, handled, all]
            default: open
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Escalades, avec le décompte par statut.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/escalations/{escalation_id}:
    parameters:
      - $ref: '#/components/parameters/EscalationId'
    get:
      tags: [Escalades]
      operationId: getEscalation
      summary: Lire une escalade
      x-required-scope: escalations:read
      x-required-role: readonly
      responses:
        '200':
          description: Escalade.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Escalation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Agent
  /v1/agent/status:
    get:
      tags: [Agent]
      operationId: getAgentStatus
      summary: État de l'agent
      x-required-scope: agent:read
      x-required-role: readonly
      responses:
        '200':
          description: État de l'agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/agent/pause:
    post:
      tags: [Agent]
      operationId: pauseAgent
      summary: Mettre l'agent en pause (interrupteur d'urgence)
      description: |
        Suspend les réponses automatiques de **toutes** les conversations du compte. Les messages reçus
        restent enregistrés. Réversible avec `resume`.
      x-required-scope: agent:write
      x-required-role: manager
      responses:
        '200':
          description: État de l'agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/agent/resume:
    post:
      tags: [Agent]
      operationId: resumeAgent
      summary: Reprendre les réponses automatiques
      x-required-scope: agent:write
      x-required-role: manager
      responses:
        '200':
          description: État de l'agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

