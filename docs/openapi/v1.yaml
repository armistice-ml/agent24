      x-required-scope: config:read
      x-required-role: readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Versions, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigVersionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/config/versions/{version}/restore:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Configuration]
      operationId: restoreConfigVersion
      summary: Restaurer une version précédente
