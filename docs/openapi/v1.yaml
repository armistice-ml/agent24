  # ------------------------------------------------------------------ Test
  /v1/test/messages:
    post:
      tags: [Test]
      operationId: simulateInboundMessage
      summary: Simuler un message entrant
      description: |
        **Espace de test uniquement** (`409 live_mode_not_allowed` en Live). Crée le contact et la conversation
        si besoin, enregistre le message comme s'il arrivait d'un canal, et déclenche l'agent. La réponse de
        l'agent apparaît dans la conversation (`delivery_status = captured`) et déclenche les mêmes
        événements qu'en Live.
      x-required-scope: test:write
      x-required-role: employee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
